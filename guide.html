<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Guide - Hacker's Toolkit</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.cdnfonts.com/css/cabinet-grotesk" rel="stylesheet" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" />
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="styles.css" />
</head>
<body class="dark noise-overlay">
    <header class="header header-sticky">
        <div class="header-content">
            <div class="header-left">
                <div class="logo" onclick="window.location.href='index.html'" style="cursor: pointer;">
                    <div class="logo-icon">
                        <i data-lucide="code"></i>
                    </div>
                    <div>
                        <h1 class="logo-title">Hacker's Toolkit</h1>
                        <p class="logo-subtitle">MADE FOR HACKCLUB</p>
                    </div>
                </div>
            </div>
            <div class="header-right">
                <button class="btn btn-ghost btn-rounded" onclick="window.location.href='browse.html'" data-testid="back-to-browse-button">
                    <i data-lucide="arrow-left"></i>
                    Browse
                </button>
                <button class="theme-toggle" data-testid="theme-toggle-button" onclick="toggleTheme()">
                    <i data-lucide="sun" class="theme-icon-light"></i>
                    <i data-lucide="moon" class="theme-icon-dark"></i>
                </button>
            </div>
        </div>
    </header>

    <div id="loading" class="loading" style="min-height: 60vh; display: flex; align-items: center; justify-content: center;">
        <div class="spinner"></div>
    </div>

    <div id="guide-content" class="guide-container" style="display: none;"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
    <script src="theme.js"></script>
    <script src="guides-data.js"></script>
    <script src="guide.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
